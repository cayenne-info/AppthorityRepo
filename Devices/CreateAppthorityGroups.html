        <h3>Create Appthority Groups</h3>
        <p>Click <img src="../Resources/Images/Common/Icons/AddMenuIcon.png" /> in the <span class="UIelement">Devices</span> tab to access the menu to add Appthority device groups. </p>
        <p class="StepHead">To create an Appthority group</p>
        <ol>
            <li value="1">Select the option from the dropdown.<br /><img src="../Resources/Images/Devices/CreateAppthorityGroupsMenu.png" /></li>
            <li value="2">Enter a name for the group and click <span class="UIelement">Create</span>. <br /><img src="../Resources/Images/Devices/CreateAppthorityGroups.png" /></li>
        </ol>
